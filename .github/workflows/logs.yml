# Read backend logs from the OCI instance on demand.
#
# The deploy workflow already holds the only SSH key the instance accepts, so
# this reuses the same secrets rather than handing that key to a laptop.
name: Fetch backend logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'How many log lines to tail'
        type: string
        default: '300'
      grep:
        description: 'Only lines matching this (empty = all)'
        type: string
        default: ''

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Open SSH session to the instance
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<CFG
          Host oci
            HostName ${{ secrets.OCI_HOST }}
            User ${{ secrets.OCI_SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          CFG

      - name: Tail backend logs
        run: |
          ssh oci "cd ${{ secrets.APP_DIR }} && \
            docker compose logs --tail ${{ inputs.lines }} --no-color backend" \
            > logs.txt 2>&1 || true

          if [ -n "${{ inputs.grep }}" ]; then
            echo "=== lines matching '${{ inputs.grep }}' ==="
            grep -iE -- '${{ inputs.grep }}' logs.txt || echo "(no match)"
            echo
          fi
          echo "=== last ${{ inputs.lines }} lines ==="
          cat logs.txt

      # The market-data diagnosis needs the upstream error line specifically.
      - name: Highlight market-data failures
        run: |
          echo "=== gold / commodity / upstream failures ==="
          grep -iE 'gold|commodity|giavangnet|btmc|reference list is empty' logs.txt \
            || echo "(nothing logged for market data)"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: logs.txt
