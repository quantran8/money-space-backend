# Build the backend image for arm64, push it to OCIR, and roll it out on the
# Oracle Cloud Ampere instance that terraform/ provisions.
#
# Terraform owns the host; this workflow owns what runs on it. Secrets live in
# GitHub, never in Terraform state.
name: Deploy backend to OCI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run `prisma migrate deploy` before restarting'
        type: boolean
        default: false

concurrency:
  # One rollout at a time; a newer push supersedes an in-flight one.
  group: deploy-oci
  cancel-in-progress: false

# Registry coordinates come from vars, not secrets, and that is load-bearing:
# GitHub redacts secret values wherever they appear in step outputs, so an image
# reference built from secrets arrives at the next job as an empty string —
# which Compose then rejects with "service backend has neither an image nor a
# build context". None of these three identify anything sensitive; the token
# that grants access is still a secret.
#
# No secrets.* fallback on purpose. The fallback defeats the fix: if the
# variables are missing, the expression resolves to the secret, and the redaction
# that broke the image reference in the first place applies again — producing the
# same empty value with no hint as to why. Missing variables must fail loudly
# instead.
env:
  OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
  OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}

jobs:
  build:
    # Production only ever runs code from master. The push trigger already
    # guarantees that, but "Run workflow" accepts any branch from the UI — this
    # stops a feature branch from being deployed by an accidental click.
    if: github.ref == 'refs/heads/master'
    # Build on a runner whose CPU already matches the target. QEMU emulation of
    # arm64 on an x86 runner crashed the Node/Prisma layers with
    # "uncaught target signal 4 (Illegal instruction)" and, when it did survive,
    # took 10-15 minutes. A native runner does neither.
    runs-on: ${{ vars.BUILD_PLATFORM == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      # The image architecture must match the instance's. A1 is aarch64, while
      # E2.1.Micro is x86_64 — build for the wrong one and the container dies
      # immediately with "exec format error". `terraform output image_platform`
      # prints the right value; BUILD_PLATFORM carries it here, and it also
      # selects the runner above so the build is never emulated.
      - uses: docker/setup-buildx-action@v3

      - name: Check runner matches the target platform
        run: |
          # A mismatch here means the build silently falls back to QEMU, which
          # is exactly what this workflow no longer wants. Fail instead.
          want='${{ vars.BUILD_PLATFORM || 'linux/arm64' }}'
          case "$(uname -m)" in
            aarch64|arm64) have=linux/arm64 ;;
            x86_64)        have=linux/amd64 ;;
            *)             have="linux/$(uname -m)" ;;
          esac
          echo "target=$want runner=$have ($(uname -m))"
          if [ "$want" != "$have" ]; then
            echo "::error::Runner is $have but BUILD_PLATFORM is $want — the build would be emulated under QEMU."
            echo "Set BUILD_PLATFORM to linux/arm64 or linux/amd64 so it maps to a native runner." >&2
            exit 1
          fi

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Check registry coordinates
        run: |
          # Both jobs derive the image reference from these three variables
          # rather than passing it between them: GitHub silently drops a job
          # output that matches a registered secret ("Skip output 'image_ref'
          # since it may contain secret"), which left the deploy job with an
          # empty image and a misleading Compose error.
          if [ -z "${OCIR_REGISTRY}" ] || [ -z "${OCIR_NAMESPACE}" ] || [ -z "${OCIR_REPOSITORY}" ]; then
            echo "::error::Registry coordinates are incomplete."
            echo "Set all three as VARIABLES (not secrets) under" >&2
            echo "Settings > Secrets and variables > Actions > Variables:" >&2
            echo "  OCIR_REGISTRY    e.g. ap-singapore-1.ocir.io" >&2
            echo "  OCIR_NAMESPACE   e.g. axttup8tl3ug" >&2
            echo "  OCIR_REPOSITORY  e.g. money-space-backend" >&2
            echo "Received: registry='${OCIR_REGISTRY}' namespace='${OCIR_NAMESPACE}' repo='${OCIR_REPOSITORY}'" >&2
            exit 1
          fi
          echo "image: ${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}:${GITHUB_SHA}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.BUILD_PLATFORM || 'linux/arm64' }}
          push: true
          tags: |
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:${{ github.sha }}
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:latest
          # Registry-backed layer cache, so unchanged pnpm layers are reused.
          cache-from: type=registry,ref=${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Open SSH session to the instance
        env:
          # Via env rather than inlined into the script: a multi-line secret
          # substituted straight into `run` is fragile, and keeping it in a
          # variable also stops the key from ever appearing in the command line.
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          # OpenSSH rejects a key whose final -----END----- line has no trailing
          # newline with the opaque "error in libcrypto", and copying a key
          # through a browser drops that newline routinely. printf '%s\n'
          # guarantees exactly one, and the CRLF strip covers keys that made a
          # detour through a Windows editor.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Fail here, with a readable message, rather than 30 rounds of
          # "Permission denied" further down.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::OCI_SSH_PRIVATE_KEY is not a usable private key."
            echo "Checks, in the order they usually fail:" >&2
            echo "  1. It must be the PRIVATE half (~/.ssh/money_space_deploy)," >&2
            echo "     not the .pub file." >&2
            echo "  2. It must include the -----BEGIN----- and -----END----- lines." >&2
            echo "  3. Re-copy it with: cat ~/.ssh/money_space_deploy | pbcopy" >&2
            echo "First and last line of what was received:" >&2
            head -1 ~/.ssh/id_deploy >&2
            tail -1 ~/.ssh/id_deploy >&2
            exit 1
          fi
          echo "key loaded: $(ssh-keygen -lf ~/.ssh/id_deploy)"
          # Trust on first use: the host is created fresh by Terraform, so
          # there is no pre-existing key to pin. Replace with a known_hosts
          # entry from `ssh-keyscan` if you want strict checking.
          cat >> ~/.ssh/config <<CFG
          Host oci
            HostName ${{ secrets.OCI_HOST }}
            User ${{ secrets.OCI_SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          CFG

      - name: Wait for cloud-init to finish
        # First deploy after `terraform apply` can race the Docker install.
        run: |
          for i in $(seq 1 30); do
            if ssh oci 'test -f /var/lib/cloud/instance/provisioning-complete'; then
              echo "host provisioned"; exit 0
            fi
            echo "waiting for cloud-init ($i/30)..."; sleep 20
          done
          echo "cloud-init did not complete in time" >&2
          ssh oci 'sudo tail -40 /var/log/cloud-init-output.log' || true
          exit 1

      - name: Upload compose file and Caddyfile
        run: |
          scp deploy/docker-compose.prod.yml oci:"${{ secrets.APP_DIR }}/docker-compose.yml"
          scp deploy/Caddyfile               oci:"${{ secrets.APP_DIR }}/Caddyfile"

      - name: Upload the log-shipper config
        # Uploaded unconditionally, even when ENABLE_OBSERVABILITY is off: the
        # files are inert without the second compose file, so having them on
        # disk makes turning shipping on a variable flip, not a redeploy. The
        # observability compose file mounts them by relative path
        # (./observability/...), so the layout here must match.
        #
        # grafana/dashboards/ is deliberately NOT uploaded — the dashboard is
        # imported by hand into Grafana Cloud, and nothing on the VM reads it.
        run: |
          ssh oci "mkdir -p ${{ secrets.APP_DIR }}/observability"
          scp -r deploy/observability/alloy \
                 deploy/observability/docker-compose.observability.yml \
                 oci:"${{ secrets.APP_DIR }}/observability/"

      - name: Write .env on the instance
        # Piped over stdin so no secret is ever an argv entry (visible in `ps`)
        # or a file on the runner. Written 0600, owned by the deploy user.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          # Market-data providers. Each price provider activates only when its
          # key is present (see provider-routing.ts), so omitting one is a
          # supported configuration, not a failure: routing simply drops the
          # asset classes it served. The base URLs stay variables — they are
          # host names with defaults in code, not credentials.
          COIN_MARKETCAP_API_KEY: ${{ secrets.COIN_MARKETCAP_API_KEY }}
          COIN_MARKETCAP_BASE_URL: ${{ vars.COIN_MARKETCAP_BASE_URL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_BASE_URL: ${{ vars.TWELVEDATA_BASE_URL }}
          BACKEND_IMAGE: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:${{ github.sha }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          REDIS_MAXMEMORY: ${{ vars.REDIS_MAXMEMORY || '256mb' }}
          # Read by the observability compose file, not by the app. Compose
          # interpolates ${...} from the .env next to the compose file, which is
          # this one — so it belongs here even though Nest never reads it. It
          # becomes the `host` label on every stream in Grafana Cloud.
          HOSTNAME_LABEL: ${{ vars.HOSTNAME_LABEL || 'money-space-vm' }}
          # Ships the app's own log level; `info` in production keeps the
          # per-request debug lines out of Loki.
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'money-space-backend' }}
        run: |
          # An empty image reference here surfaces on the VM as "service backend
          # has neither an image nor a build context", which points at the
          # compose file rather than at the build job that actually failed to
          # pass its output along.
          if [ -z "$BACKEND_IMAGE" ]; then
            echo "::error::BACKEND_IMAGE is empty — the build job produced no image reference." >&2
            exit 1
          fi

          {
            for key in DATABASE_URL DIRECT_URL SUPABASE_URL SUPABASE_ANON_KEY \
                       SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWKS_URL \
                       COIN_MARKETCAP_API_KEY COIN_MARKETCAP_BASE_URL \
                       TWELVEDATA_API_KEY TWELVEDATA_BASE_URL \
                       BACKEND_IMAGE APP_PORT DOMAIN_NAME ACME_EMAIL \
                       REDIS_MAXMEMORY HOSTNAME_LABEL \
                       LOG_LEVEL SERVICE_NAME; do
              # ACME_EMAIL goes to Caddy's own env file, written below.
              if [ "$key" = "ACME_EMAIL" ]; then continue; fi
              # An unset optional key must be absent, not empty: the code tests
              # truthiness of the key to decide whether a provider is active,
              # and `KEY=""` would also override a default base URL with "".
              if [ -z "${!key}" ]; then continue; fi
              # Compose parses env_file with dotenv rules, not shell rules:
              # inside double quotes only \ and " are escapes, and $ / # are
              # literal. Shell-style '\'' quoting would make Compose drop the
              # line entirely, so escape for dotenv instead.
              value=${!key}
              value=${value//\\/\\\\}
              value=${value//\"/\\\"}
              printf '%s="%s"\n' "$key" "$value"
            done
          } | ssh oci "umask 077 && cat > ${{ secrets.APP_DIR }}/.env"

      - name: Write Caddy's env file
        if: vars.DOMAIN_NAME != ''
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          # Kept separate from the app's .env so the proxy never sees the
          # Supabase keys. The ACME_EMAIL line is omitted entirely when no
          # address is configured: the Caddyfile falls back to a placeholder
          # contact for an ABSENT variable, but an empty one is a parse error
          # that would crash-loop Caddy.
          {
            if [ -n "$ACME_EMAIL" ]; then
              printf 'ACME_EMAIL="%s"\n' "${ACME_EMAIL//\"/\\\"}"
            fi
          } | ssh oci "umask 077 && cat > ${{ secrets.APP_DIR }}/.env.caddy"

      - name: Write Alloy's env file
        if: vars.ENABLE_OBSERVABILITY == 'true'
        env:
          GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
          GRAFANA_CLOUD_LOKI_TOKEN: ${{ secrets.GRAFANA_CLOUD_LOKI_TOKEN }}
        run: |
          # Its own file, like Caddy's: Alloy ships logs to a third party and has
          # no business holding the Supabase service-role key.
          #
          # All three values come from the Grafana Cloud portal under
          # Home > Connections > Loki > Send logs. The user is the numeric stack
          # id shown there, NOT an email address — an email authenticates fine
          # against the portal and gets a 401 from the push endpoint.
          missing=""
          for key in GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER GRAFANA_CLOUD_LOKI_TOKEN; do
            if [ -z "${!key}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::ENABLE_OBSERVABILITY is on but these are unset:$missing" >&2
            echo "URL and USER are Variables; TOKEN is a Secret." >&2
            echo "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          # dotenv escaping, same as the app's .env: backslash first, then the
          # quote, or the escape added for a quote gets escaped again.
          emit() {
            local value=$2
            value=${value//\\/\\\\}
            value=${value//\"/\\\"}
            printf '%s="%s"\n' "$1" "$value"
          }
          {
            emit GRAFANA_CLOUD_LOKI_URL "$GRAFANA_CLOUD_LOKI_URL"
            emit GRAFANA_CLOUD_LOKI_USER "$GRAFANA_CLOUD_LOKI_USER"
            emit GRAFANA_CLOUD_LOKI_TOKEN "$GRAFANA_CLOUD_LOKI_TOKEN"
          } | ssh oci "umask 077 && cat > ${{ secrets.APP_DIR }}/.env.alloy"

      - name: Log the instance in to OCIR
        run: |
          printf '%s' '${{ secrets.OCIR_TOKEN }}' | ssh oci \
            "docker login ${{ env.OCIR_REGISTRY }} \
               --username '${{ secrets.OCIR_USERNAME }}' --password-stdin"

      - name: Pull and restart
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ENABLE_OBSERVABILITY: ${{ vars.ENABLE_OBSERVABILITY }}
        run: |
          # The caddy service sits behind the `tls` profile, so it starts only
          # when a domain is actually configured. --remove-orphans then also
          # tears Caddy down cleanly if the domain is ever unset.
          profile=""
          if [ -n "$DOMAIN_NAME" ]; then profile="--profile tls"; fi

          # Alloy comes from a second compose file rather than a profile in the
          # first, so shipping logs stays a per-host decision — and
          # --remove-orphans in the app-only form then stops it cleanly when the
          # variable is turned off.
          files="-f docker-compose.yml"
          if [ "$ENABLE_OBSERVABILITY" = "true" ]; then
            files="$files -f observability/docker-compose.observability.yml"
          fi

          ssh oci "cd ${{ secrets.APP_DIR }} && \
            docker compose $files $profile pull && \
            docker compose $files $profile up -d --remove-orphans"

      - name: Run database migrations
        if: inputs.run_migrations
        # The image ships prisma/ but not the prisma CLI (a dev dependency), so
        # fetch it at run time. --env-file supplies DATABASE_URL/DIRECT_URL.
        run: |
          ssh oci "cd ${{ secrets.APP_DIR }} && \
            docker run --rm --env-file .env \
              --entrypoint sh '${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:${{ github.sha }}' \
              -c 'npx --yes prisma@6.19.3 migrate deploy'"

      - name: Verify health
        run: |
          for i in $(seq 1 20); do
            if ssh oci "curl -fsS localhost:${{ vars.APP_PORT || '3000' }}/health" ; then
              echo; echo "backend healthy"; exit 0
            fi
            echo "waiting for backend ($i/20)..."; sleep 6
          done
          echo "backend never became healthy" >&2
          ssh oci "cd ${{ secrets.APP_DIR }} && docker compose ps && docker compose logs --tail 80 backend" >&2
          exit 1

      - name: Verify HTTPS
        if: vars.DOMAIN_NAME != ''
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          # Issuing the first certificate takes Caddy a few seconds after the
          # ACME HTTP-01 challenge round-trip, so this polls rather than
          # checking once. Run from the runner, not the VM: that exercises the
          # public DNS record and the real certificate chain.
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                     "https://$DOMAIN_NAME/health" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://$DOMAIN_NAME/health -> 200"
              curl -sS --max-time 10 "https://$DOMAIN_NAME/health"; echo
              exit 0
            fi
            echo "waiting for certificate ($i/20, last status $code)..."; sleep 10
          done

          echo "::error::HTTPS on $DOMAIN_NAME did not come up." >&2
          echo "Most likely the A record does not point at this instance yet." >&2
          echo "DNS currently resolves to:" >&2
          getent hosts "$DOMAIN_NAME" >&2 || echo "  (no A record found)" >&2
          echo "Instance address: ${{ secrets.OCI_HOST }}" >&2
          ssh oci "cd ${{ secrets.APP_DIR }} && docker compose logs --tail 60 caddy" >&2
          exit 1

      - name: Prune old images
        if: always()
        run: ssh oci 'docker image prune -af --filter "until=168h"'
